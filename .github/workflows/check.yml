# Runs the project's own checks on every pull request and every push to main through the pipeline's gate script:
# the production build with its type check, the unit tests, then the browser smoke test (pipeline/README.md). On a pull
# request whose title starts with its task id(s) ("FA12: …", "FA5 + FA9: …") it also runs the scope and changelog gates
# (audit CORE-08). What runs only on a worker's machine or the owner's: the perf gate (no baseline or GPU on a runner),
# the frame-time budget (the owner's laptop, by hand) and the critic.
name: Check

on:
  push:
    branches: [main]
  pull_request:
    # `edited` too, so renaming a pull request's title (its task ids) runs the scope and changelog gates again.
    types: [opened, synchronize, reopened, edited]

# A newer push to a pull request cancels its older run. Pushes to main are grouped by commit, so no run on main is
# cancelled (GitHub drops a pending run in the same group whatever cancel-in-progress says) and every merge shows
# whether main is green.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The headless bot-match tests (src/ai/depotMatch*.test.ts, vitest project `slow`) are most of the unit suite: the
    # longest take 18-25 s each (custom, flag, ricochetFlag, ends, ricochet, customFlag; the custom-match file was
    # 42 s before FA11b split it by mode), about 155 s of work in all. Measured 2026-10-04 in a 4-core container (FA11b,
    # audit CORE-15): the suite takes 3 min 08 s of CPU with files sharing a worker (vite.config.ts `isolate: false`;
    # 3 min 49 s isolated), so about 1.5-2 min on a 2-vCPU runner; 73-91 s of wall time there, with other work running.
    # The city guards (M34c) and the Pro guards on every map (M40, src/ai/*Match.pro*.test.ts, about 7 min of CPU in
    # the container) took the job to about 13 min before M40 and an estimated 18-20 min after, so the limit is 30.
    timeout-minutes: 30
    steps:
      # The whole history, so the scope gate can diff the pull request against its base and find the task block a
      # branch cleared before merging (pipeline/scope.mjs).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright's Chromium is cached per lockfile (the Playwright version pins the browser build).
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # The system libraries it needs live outside that cache. The runner's image usually has them already, so apt runs
      # (about a minute) only when the cached browser can't start without them (audit CORE-14).
      - name: Playwright's system libraries, only when missing
        run: |
          if node -e "import('@playwright/test').then(({ chromium }) => chromium.launch()).then((b) => b.close())"; then
            echo "Chromium starts; no system libraries to install"
          else
            npx playwright install-deps chromium
          fi
      # The pipeline's gate script (pipeline/README.md): the production build, the unit tests, the smoke test (which
      # builds the e2e bundle once and loads the production build too), and on a pull request the scope and changelog
      # gates for the task ids its title starts with. Writes pipeline/out/gate-report.json with pass / fail per gate.
      # A pull request is checked out as its merge commit, whose first parent is the base it would merge into.
      - name: Gates
        env:
          GATE_PR_TITLE: ${{ github.event.pull_request.title }}
        run: node pipeline/gate.mjs --ci ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '' }}
      - name: Upload the gate report, the test reports and the smoke test report (screenshot inside)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: |
            pipeline/out/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
