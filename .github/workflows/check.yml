# Runs the project's own checks on every pull request and every push to main through the pipeline's gate script:
# the production build with its type check, the unit tests and the browser smoke test (pipeline/README.md), split over
# parallel jobs. On a pull request whose title starts with its task id(s) ("FA12: …", "FA5 + FA9: …") it also runs the
# scope and changelog gates (audit CORE-08), and on every pull request that is not a draft the review gate: unless the
# change is docs only, its description's Review line says the critic, QA and performance agents passed (owner,
# 2026-10-16). What runs only on a worker's machine or the owner's: the perf gate (no baseline or GPU on a runner), the
# frame-time budget (the owner's laptop, by hand) and the three review agents themselves.
name: Check

on:
  push:
    branches: [main]
  pull_request:
    # `edited` too, so renaming a pull request's title (its task ids) or editing its Review line runs the gates again, and
    # `ready_for_review`, so a draft marked ready is held to its Review line.
    types: [opened, synchronize, reopened, edited, ready_for_review]

# A newer push to a pull request cancels its older run. Pushes to main are grouped by commit, so no run on main is
# cancelled (GitHub drops a pending run in the same group whatever cancel-in-progress says) and every merge shows
# whether main is green.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Five kinds of job (audit CORE-04, IM6, IN1, DX4): `bundles` builds the production and e2e bundles once, then `check`
# (the build gate, the fast unit tests, scope and changelog) and `browser` (the smoke test in shares) start from them,
# while `firefox` (the boot and save specs in Firefox, which builds its own) and `slow` (the headless bot-match guards in
# shares) run beside them from the start. In one job the smoke test alone took about 1,290 s by RM8 (2026-10-12, main
# 19d3858), so every check took about 25 minutes; split, the longest job is a few minutes. Before DX4 each browser
# share built both bundles itself, eight builds a run.
jobs:
  # Both bundles, built once per run from this commit and handed on as one tar in a cache entry keyed by the run, so
  # `check` and every `browser` share reuse them (pipeline/build-cached.mjs finds its stamp matches the source and skips
  # the build). The tar keeps each file's time to the nanosecond, which the stamp checks. Same full checkout as
  # `check`, so `git describe`, part of the source hash, is the same in every job.
  bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The production build is the type check and the chunk budgets too (npm run build), with the .br/.gz copies the
      # release smoke test serves.
      - name: Build the production and e2e bundles
        env:
          AIRSOFT_PRECOMPRESS: '1'
        run: |
          node pipeline/build-cached.mjs --mode production --force
          node pipeline/build-cached.mjs --mode e2e --force
          tar --format=posix -cf bundles.tar dist dist-e2e pipeline/out/build-production.json pipeline/out/build-e2e.json
      - name: Hand the bundles on
        uses: actions/cache@v6
        with:
          path: bundles.tar
          key: bundles-${{ github.run_id }}-${{ github.run_attempt }}

  # The build with its type check and chunk budgets, the fast unit tests (177 s on main 19d3858), and on a pull request
  # the scope and changelog gates. No browser: the smoke test runs in the `browser` jobs.
  check:
    needs: bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The whole history, so the scope gate can diff the pull request against its base and find the task block a
      # branch cleared before merging (pipeline/scope.mjs), and the tags with it, so the build's `git describe` names
      # the release it follows ("0.1 Dev 3+12 · abc1234") rather than "build abc1234" (audit CORE-10;
      # config/buildVersion.ts). fetch-depth 0 brings the tags already; fetch-tags says so where it can't be missed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The bundles job's build
        uses: actions/cache@v6
        with:
          path: bundles.tar
          key: bundles-${{ github.run_id }}-${{ github.run_attempt }}
      # The tar goes once unpacked: the gate's scope check counts untracked files as part of the change.
      - run: if [ -f bundles.tar ]; then tar -xf bundles.tar && rm bundles.tar; else echo "No bundles from this run; the build steps make their own"; fi
      # The pipeline's gate script (pipeline/README.md): the production build (on CI the bundles job's, reused),
      # the unit tests, and on a pull request
      # the scope and changelog gates for the task ids its title starts with and the review gate (pipeline/review.mjs). Writes pipeline/out/gate-report.json with
      # pass / fail per gate. A pull request is checked out as its merge commit, whose first parent is the base it would
      # merge into.
      - name: Gates
        env:
          GATE_PR_TITLE: ${{ github.event.pull_request.title }}
          GATE_PR_BODY: ${{ github.event.pull_request.body }}
          GATE_PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: node pipeline/gate.mjs --ci --tests fast --no-smoke ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '' }}
      - name: Upload the gate report and the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gate-report
          path: pipeline/out/
          if-no-files-found: ignore
          retention-days: 7

  # The browser smoke test (e2e/, Playwright in software rendering) in four shares of its files (playwright --shard,
  # which splits by test count and keeps a file's tests together). Each share's two servers serve the bundles job's
  # builds: pipeline/build-cached.mjs sees they are this source's and builds nothing.
  browser:
    needs: bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # The full checkout the bundles job had, so the source hash (which includes `git describe`) matches its stamps.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The bundles job's builds
        uses: actions/cache@v6
        with:
          path: bundles.tar
          key: bundles-${{ github.run_id }}-${{ github.run_attempt }}
      - run: if [ -f bundles.tar ]; then tar -xf bundles.tar && rm bundles.tar; else echo "No bundles from this run; the build steps make their own"; fi
      # Playwright's Chromium is cached per lockfile (the Playwright version pins the browser build).
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # The system libraries it needs live outside that cache. The runner's image usually has them already, so apt runs
      # (about a minute) only when the cached browser can't start without them (audit CORE-14).
      - name: Playwright's system libraries, only when missing
        run: |
          if node -e "import('@playwright/test').then(({ chromium }) => chromium.launch()).then((b) => b.close())"; then
            echo "Chromium starts; no system libraries to install"
          else
            npx playwright install-deps chromium
          fi
      - name: Smoke test, share ${{ matrix.shard }} of 4
        run: node pipeline/gate.mjs --ci --only smoke --shard ${{ matrix.shard }}/4
      - name: Upload the gate report and the smoke test report (screenshots inside)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gate-report-browser-${{ matrix.shard }}
          path: |
            pipeline/out/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The boot and save specs in Firefox (IN1): Playwright's own Firefox, headed under xvfb-run (headless Firefox gets no
  # WebGL 2 without a GPU), through the gate's smoke step with E2E_FIREFOX=1 (playwright.config.ts: the Firefox project
  # and the e2e build's server only). The cloud containers can't download Playwright's Firefox, so this is where it runs.
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cached per lockfile, apart from the `browser` jobs' Chromium (the Playwright version pins the browser build).
      - name: Cache Playwright's Firefox
        id: firefox-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.firefox-cache.outputs.cache-hit != 'true'
        run: npx playwright install firefox
      # Its system libraries and xvfb live outside that cache: apt runs only when Firefox can't start without them.
      - name: Firefox's system libraries, only when missing
        run: |
          if command -v xvfb-run && node -e "import('@playwright/test').then(({ firefox }) => firefox.launch()).then((b) => b.close())"; then
            echo "Firefox starts; no system libraries to install"
          else
            npx playwright install-deps firefox
            sudo apt-get install -y xvfb
          fi
      - name: Boot and save specs in Firefox
        env:
          E2E_FIREFOX: '1'
        run: xvfb-run --auto-servernum node pipeline/gate.mjs --ci --only smoke
      - name: Upload the gate report and the Firefox report (screenshots inside)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gate-report-firefox
          path: |
            pipeline/out/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The headless bot-match guards (src/ai/depotMatch*.test.ts, the Pro, levels and Extraction balance guards), in three
  # shares of their files: no build or browser, so each starts on its tests at once. Nothing here is built, so the
  # default shallow checkout (no tags) is enough. vitest's own --shard split them by a hash of their paths, so on main
  # f42ecc0 one share drew 290 s and another 69 s; the gate now deals them by their measured seconds
  # (pipeline/slow-times.json, pipeline/shards.mjs), about 450 s of a 4-core container's work each (DX4).
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Slow guards, share ${{ matrix.shard }} of 3
        run: node pipeline/gate.mjs --ci --tests slow --shard ${{ matrix.shard }}/3 --only tests
      - name: Upload the gate report and the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gate-report-slow-${{ matrix.shard }}
          path: pipeline/out/
          if-no-files-found: ignore
          retention-days: 7
