# Runs the project's own checks on every pull request and every push to main through the pipeline's gate script:
# the production build with its type check, the unit tests, then the browser smoke test (pipeline/README.md).
name: Check

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its older run. Pushes to main are grouped by commit, so no run on main is
# cancelled (GitHub drops a pending run in the same group whatever cancel-in-progress says) and every merge shows
# whether main is green.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The headless bot-match tests (src/ai/depotMatch*.test.ts, ~175 s of work in all) are split into files of at
    # most ~40 s each (measured locally 2026-10-04) that vitest runs in parallel; CI runners are slower.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright's Chromium is cached per lockfile (the Playwright version pins the browser build); the system
      # libraries it needs are installed every run, since they live outside the cache.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright install-deps chromium
      # The pipeline's gate script (pipeline/README.md) runs the same checks as before, `npm run check` and the smoke
      # test, and writes pipeline/out/gate-report.json with pass / fail per gate; no perf gate on a runner (no baseline).
      - run: node pipeline/gate.mjs --ci
      - name: Upload the gate report, the test reports and the smoke test report (screenshot inside)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: |
            pipeline/out/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
