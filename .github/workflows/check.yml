# Runs the project's own checks on every pull request and every push to main:
# unit tests + production build with its type check (`npm run check`), then the browser smoke test.
name: Check

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its older run; runs on main always finish, so every merge shows whether
# main is green.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The headless bot-match tests (src/ai/depotMatch*.test.ts, ~175 s of work in all) are split into files of at
    # most ~40 s each (measured locally 2026-10-04) that vitest runs in parallel; CI runners are slower.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Playwright's Chromium is cached per lockfile (the Playwright version pins the browser build); the system
      # libraries it needs are installed every run, since they live outside the cache.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright install-deps chromium
      - run: npm run test:browser
      - name: Upload the smoke test report (screenshot inside)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
