# Runs the project's own checks on every pull request and every push to main through the pipeline's gate script:
# the production build with its type check, the unit tests, then the browser smoke test (pipeline/README.md). On a pull
# request whose title starts with its task id(s) ("FA12: …", "FA5 + FA9: …") it also runs the scope and changelog gates
# (audit CORE-08). What runs only on a worker's machine or the owner's: the perf gate (no baseline or GPU on a runner),
# the frame-time budget (the owner's laptop, by hand) and the critic.
name: Check

on:
  push:
    branches: [main]
  pull_request:
    # `edited` too, so renaming a pull request's title (its task ids) runs the scope and changelog gates again.
    types: [opened, synchronize, reopened, edited]

# A newer push to a pull request cancels its older run. Pushes to main are grouped by commit, so no run on main is
# cancelled (GitHub drops a pending run in the same group whatever cancel-in-progress says) and every merge shows
# whether main is green.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The build, the fast unit tests, the browser smoke test and the scope and changelog gates. The headless bot-match
  # guards (vitest project `slow`) run beside it in the `slow` job's shards (audit CORE-04): measured 2026-10-05 in a
  # 4-core container they are about 1,420 s of work (the longest file, Woodland's Extraction balance, 213 s), which in
  # one job took the whole check towards its 30-minute limit. Split, each job is a few minutes; the limits are 20.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The whole history, so the scope gate can diff the pull request against its base and find the task block a
      # branch cleared before merging (pipeline/scope.mjs), and the tags with it, so the build's `git describe` names
      # the release it follows ("0.1 Dev 3+12 · abc1234") rather than "build abc1234" (audit CORE-10;
      # config/buildVersion.ts). fetch-depth 0 brings the tags already; fetch-tags says so where it can't be missed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright's Chromium is cached per lockfile (the Playwright version pins the browser build).
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # The system libraries it needs live outside that cache. The runner's image usually has them already, so apt runs
      # (about a minute) only when the cached browser can't start without them (audit CORE-14).
      - name: Playwright's system libraries, only when missing
        run: |
          if node -e "import('@playwright/test').then(({ chromium }) => chromium.launch()).then((b) => b.close())"; then
            echo "Chromium starts; no system libraries to install"
          else
            npx playwright install-deps chromium
          fi
      # The pipeline's gate script (pipeline/README.md): the production build, the unit tests, the smoke test (which
      # builds the e2e bundle once and loads the production build too), and on a pull request the scope and changelog
      # gates for the task ids its title starts with. Writes pipeline/out/gate-report.json with pass / fail per gate.
      # A pull request is checked out as its merge commit, whose first parent is the base it would merge into.
      - name: Gates
        env:
          GATE_PR_TITLE: ${{ github.event.pull_request.title }}
        run: node pipeline/gate.mjs --ci --tests fast ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '' }}
      - name: Upload the gate report, the test reports and the smoke test report (screenshot inside)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: |
            pipeline/out/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The headless bot-match guards (src/ai/depotMatch*.test.ts, the Pro, levels and Extraction balance guards), in three
  # shares of their files (vitest --shard): no build or browser, so each starts on its tests at once. Nothing here is
  # built, so the default shallow checkout (no tags) is enough: the version label only matters in `check`'s build.
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Slow guards, share ${{ matrix.shard }} of 3
        run: node pipeline/gate.mjs --ci --tests slow --shard ${{ matrix.shard }}/3 --only tests
      - name: Upload the gate report and the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-report-slow-${{ matrix.shard }}
          path: pipeline/out/
          if-no-files-found: ignore
          retention-days: 7
