# Runs the project's own checks on every pull request and every push to main:
# type check + unit tests + production build (`npm run check`), then the browser smoke test.
name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The headless bot-match tests (src/ai/depotMatch*.test.ts, ~175 s of work in all) are split into files of at
    # most ~40 s each (measured locally 2026-10-04) that vitest runs in parallel; CI runners are slower.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload the smoke test report (screenshot inside)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
